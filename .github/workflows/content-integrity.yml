name: Math Content Integrity Gate

on:
  pull_request:
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "subject-manifest.json"
      - "subject-manifest.js"
      - "assets/**"
      - "data/**"
      - "tools/e145_content_integrity.py"
      - "tools/e177_content_coverage.py"
      - "tools/e182_supplement_bundle_builder.py"
      - "tools/e155_browser_smoke.mjs"
      - ".github/workflows/content-integrity.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "service-worker.js"
      - "subject-manifest.json"
      - "subject-manifest.js"
      - "assets/**"
      - "data/**"
      - "tools/e145_content_integrity.py"
      - "tools/e177_content_coverage.py"
      - "tools/e182_supplement_bundle_builder.py"
      - "tools/e155_browser_smoke.mjs"
      - ".github/workflows/content-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: E145 Runtime Content Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Run integrity gate
        run: python3 tools/e145_content_integrity.py
      - name: Run content coverage gate
        run: python3 tools/e177_content_coverage.py
      - name: Run bundle builder self-test
        run: python3 tools/e182_supplement_bundle_builder.py --self-test
      - name: Parse runtime JavaScript
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "node --check $file"
            node --check "$file"
          done < <(find assets -type f -name '*.js' -print0 | sort -z)
          node --check subject-manifest.js
          node --check service-worker.js
          node --check tools/e155_browser_smoke.mjs
      - name: Install browser smoke harness
        run: npm install --no-save --package-lock=false playwright-core@1.55.0
      - name: Run E155 browser smoke
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/e155-http.log 2>&1 &
          server_pid=$!
          export E155_SERVER_PID="$server_pid"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          node tools/e155_browser_smoke.mjs
