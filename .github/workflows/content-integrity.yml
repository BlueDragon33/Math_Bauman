name: Math Development Fast CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: math-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Fast content/runtime sanity
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f subject-manifest.json
          test -f subject-manifest.js
          test -f service-worker.js
          node --check subject-manifest.js
          node --check service-worker.js
          python3 -m json.tool subject-manifest.json >/dev/null
      - name: Development mode
        run: echo "Full content integrity, coverage and browser smoke are deferred during active development."
