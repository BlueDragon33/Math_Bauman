name: Math Bauman Web App Quality

on:
  push:
    branches:
      - migration/full-webapp-v2
  pull_request:
    branches:
      - main
      - migration/full-webapp-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Syntax check
        run: |
          node --check assets/webapp-bootstrap.js
          node --check assets/subject-adapter.js
          node --check assets/learner-ux.js
          node --check service-worker.js
          node --check scripts/audit-source.cjs
          node --check scripts/audit-data-contract.cjs
          node --check scripts/audit-learner-ux.cjs
          node --check scripts/build-subject-manifest.cjs
      - name: Generated manifest parity
        run: node scripts/build-subject-manifest.cjs --check
      - name: Source preservation and standalone audit
        run: |
          node scripts/audit-source.cjs
          git diff --exit-code -- reports/source-audit.generated.json
      - name: L3 data contract and migration dry-run
        run: |
          node scripts/audit-data-contract.cjs
          git diff --exit-code -- reports/data-contract.generated.json
      - name: L4 learner-first UX contract
        run: |
          node scripts/audit-learner-ux.cjs
          git diff --exit-code -- reports/learner-ux.generated.json

  browser-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install pinned browser test runtime
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Desktop, mobile and offline Web App smoke
        run: node scripts/browser-smoke.cjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-webapp-browser-smoke
          path: reports/browser-smoke.generated.json
          if-no-files-found: error
