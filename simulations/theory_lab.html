<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Theory Lab</title><style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#e5eefc;background:#06111f}body{margin:0;background:radial-gradient(circle at 15% 15%,#0ea5e933,transparent 32%),linear-gradient(135deg,#07111f,#0f172a)}.lab{min-height:100vh;padding:18px;display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.board,.panel{border:1px solid #38bdf844;border-radius:22px;background:rgba(15,23,42,.78);box-shadow:0 24px 70px #0007;padding:18px}.formula{font-size:clamp(24px,5vw,54px);font-weight:900;letter-spacing:-.04em;background:linear-gradient(90deg,#7dd3fc,#fde68a);-webkit-background-clip:text;color:transparent;margin:18px 0}.grid{height:280px;border-radius:18px;background-image:linear-gradient(#38bdf822 1px,transparent 1px),linear-gradient(90deg,#38bdf822 1px,transparent 1px);background-size:30px 30px;position:relative;overflow:hidden}.curve{position:absolute;inset:0}.curve:before{content:"";position:absolute;left:-10%;top:48%;width:120%;height:90px;border-top:5px solid #fbbf24;border-radius:50%;transform:rotate(-8deg);filter:drop-shadow(0 0 12px #fbbf24)}.dot{position:absolute;width:16px;height:16px;border-radius:50%;background:#22d3ee;box-shadow:0 0 26px #22d3ee;animation:move 4s infinite alternate ease-in-out}@keyframes move{from{left:18%;top:58%}to{left:78%;top:34%}}label{display:grid;gap:8px;margin:14px 0}span{color:#93c5fd}input{width:100%;accent-color:#38bdf8}.readout{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.readout div{background:#0f172a;border:1px solid #334155;border-radius:16px;padding:12px}b{color:#f8fafc}small{color:#a7f3d0}@media(max-width:760px){.lab{grid-template-columns:1fr}}
</style></head><body><main class="lab"><section class="board"><span>THEORY SIMULATION</span><div class="formula">f(x, θ) → y</div><div class="grid"><div class="curve"></div><div class="dot"></div></div></section><aside class="panel"><h2>Command Window</h2><p>Kéo từng tham số, giữ các biến còn lại cố định, sau đó đọc chiều biến đổi của đầu ra.</p><label><span>inputScale</span><input type="range" min="1" max="100" value="52" oninput="document.getElementById('v1').textContent=this.value"></label><label><span>noise</span><input type="range" min="0" max="100" value="18" oninput="document.getElementById('v2').textContent=this.value"></label><div class="readout"><div><b id="v1">52</b><small>scale</small></div><div><b id="v2">18</b><small>noise</small></div><div><b>Δy</b><small>sensitivity</small></div></div></aside></main></body></html>
