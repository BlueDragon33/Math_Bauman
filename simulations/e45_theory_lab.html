<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>E45 Theory Lab</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#08111f,#16223b);color:#eef6ff}.wrap{padding:18px;display:grid;gap:12px}.card{border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:16px;background:rgba(255,255,255,.08);box-shadow:0 18px 44px rgba(0,0,0,.25)}.chip{display:inline-flex;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 10px;color:#bfe7ff;font-size:12px}h1{font-size:22px;margin:.4rem 0}p{line-height:1.55;color:#d8e7ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bar{height:76px;border-radius:14px;background:linear-gradient(180deg,rgba(125,211,252,.85),rgba(59,130,246,.35));transform-origin:bottom;display:flex;align-items:end;justify-content:center;font-weight:800}.bar:nth-child(2){height:110px}.bar:nth-child(3){height:54px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="card"><span class="chip">E45 Theory Lab</span><h1>Lab mô phỏng compact</h1><p>Lab này dùng như khung nền cho mô phỏng trong module. Thao tác chính nằm ở bảng điều khiển ngoài iframe: baseline, stress, compare, failure và báo cáo kết luận.</p></section><section class="grid"><div class="bar">input</div><div class="bar">model</div><div class="bar">output</div></section></div></body></html>
