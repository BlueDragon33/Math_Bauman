<!doctype html><html lang='vi'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Kalman Sensor Fusion Lab</title><style>
:root{--bg:#071225;--card:rgba(255,255,255,.08);--line:rgba(255,255,255,.16);--text:#e5f4ff;--muted:#9fb6d6;--gold:#facc15;--cyan:#22d3ee}
*{box-sizing:border-box}body{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;margin:0;background:radial-gradient(circle at 20% 0%,rgba(34,211,238,.20),transparent 30%),linear-gradient(135deg,#071225,#0f172a);color:var(--text)}main{max-width:1100px;margin:auto;padding:24px}.card{border:1px solid var(--line);border-radius:26px;background:var(--card);padding:22px;box-shadow:0 22px 70px rgba(0,0,0,.30)}h1{margin:0 0 8px;font-size:28px}p{color:var(--muted);line-height:1.55}code{font-family:'Cambria Math','STIX Two Math',monospace;color:var(--gold);white-space:pre-wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:8px;background:rgba(255,255,255,.06);padding:14px;border-radius:18px;border:1px solid var(--line);font-weight:800}input{width:100%;accent-color:#22d3ee}.meter{height:18px;background:rgba(255,255,255,.09);border-radius:999px;overflow:hidden;border:1px solid var(--line)}.meter i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#22d3ee,#facc15);border-radius:inherit}.result{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.result article{padding:14px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.06)}.result b{display:block;font-size:24px;color:#fff}.result span{color:var(--muted);font-size:13px}.note{margin-top:16px;padding:14px;border-radius:18px;background:rgba(250,204,21,.10);border:1px solid rgba(250,204,21,.25)}@media(max-width:780px){.grid,.result{grid-template-columns:1fr}}</style></head><body><main><section class='card'><h1>Kalman Sensor Fusion Lab</h1><p>Đổi nhiễu cảm biến/mô hình để quan sát cách bộ lọc tin đo đạc hay dự báo.</p><p><b>Công thức/ý tưởng lõi:</b> <code>x̂_k = x̂_k^- + K_k(z_k-Hx̂_k^-)</code></p><div class='grid'><label>Tham số đầu vào A <input id='a' type='range' min='1' max='100' value='45'><span id='av'></span><div class='meter'><i id='am'></i></div></label><label>Tham số đầu vào B / nhiễu <input id='b' type='range' min='0' max='100' value='25'><span id='bv'></span><div class='meter'><i id='bm'></i></div></label></div><div class='result'><article><span>Độ ổn định</span><b id='st'></b></article><article><span>Độ nhạy</span><b id='sn'></b></article><article><span>Gợi ý học sâu</span><b id='hint'></b></article></div><div class='note' id='explain'></div></section></main><script>
const a=document.getElementById('a'),b=document.getElementById('b');
const av=document.getElementById('av'),bv=document.getElementById('bv'),am=document.getElementById('am'),bm=document.getElementById('bm'),st=document.getElementById('st'),sn=document.getElementById('sn'),hint=document.getElementById('hint'),ex=document.getElementById('explain');
function draw(){let A=+a.value,B=+b.value;let stability=Math.max(0,100-Math.abs(A-50)*1.1-B*.45);let sensitivity=Math.min(100,Math.abs(A-50)*1.4+B*.75);av.textContent='A = '+A;bv.textContent='B = '+B;am.style.width=A+'%';bm.style.width=B+'%';st.textContent=stability.toFixed(1)+'%';sn.textContent=sensitivity.toFixed(1)+'%';hint.textContent=stability>70?'ổn':'cần kiểm tra';ex.innerHTML='Khi thay đổi A hoặc B, hãy ghi lại: biến nào làm kết quả đổi mạnh nhất, ngưỡng nào bắt đầu mất ổn định, và công thức nào giải thích hiện tượng đó. Đây là cầu nối từ lý thuyết sang AI/robotics/НИР.';}
a.oninput=b.oninput=draw;draw();
</script></body></html>
