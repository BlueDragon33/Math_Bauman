<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Application Lab</title><style>
:root{font-family:Inter,system-ui,Segoe UI,sans-serif;color:#f8fafc;background:#050816}body{margin:0;background:radial-gradient(circle at 85% 15%,#f59e0b33,transparent 30%),linear-gradient(135deg,#020617,#111827)}.lab{min-height:100vh;padding:18px;display:grid;grid-template-columns:.95fr 1.05fr;gap:16px}.story,.panel{border:1px solid #f59e0b55;border-radius:24px;background:rgba(15,23,42,.80);box-shadow:0 24px 70px #0008;padding:18px}.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:20px}.node{min-height:92px;border-radius:18px;background:linear-gradient(180deg,#1e293b,#0f172a);border:1px solid #334155;display:grid;place-items:center;text-align:center;padding:10px;position:relative}.node:not(:last-child):after{content:"→";position:absolute;right:-14px;color:#fbbf24;font-size:24px;z-index:2}.node b{color:#fde68a}.chart{height:240px;border-radius:18px;background:linear-gradient(180deg,#0f172a,#111827);position:relative;overflow:hidden;border:1px solid #334155}.bar{position:absolute;bottom:0;width:12%;border-radius:12px 12px 0 0;background:linear-gradient(#22d3ee,#3b82f6);box-shadow:0 0 20px #22d3ee66;transition:.25s}.bar:nth-child(1){left:12%;height:42%}.bar:nth-child(2){left:34%;height:68%;background:linear-gradient(#fde68a,#f59e0b)}.bar:nth-child(3){left:56%;height:55%}.bar:nth-child(4){left:78%;height:78%;background:linear-gradient(#a7f3d0,#10b981)}label{display:grid;gap:8px;margin:14px 0;color:#bfdbfe}input{width:100%;accent-color:#f59e0b}.metric{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric div{border:1px solid #334155;border-radius:16px;padding:12px;background:#020617}b{color:white}small{color:#a7f3d0}@media(max-width:820px){.lab{grid-template-columns:1fr}.flow{grid-template-columns:1fr}.node:after{display:none}}
</style></head><body><main class="lab"><section class="story"><span>APPLICATION SIMULATION</span><h2>Đời sống/kỹ thuật → Toán → AI output</h2><div class="flow"><div class="node"><b>Hiện tượng</b></div><div class="node"><b>Dữ liệu</b></div><div class="node"><b>Công thức</b></div><div class="node"><b>Mô hình</b></div><div class="node"><b>Quyết định</b></div></div></section><aside class="panel"><h2>Simulation Dashboard</h2><label>Data quality<input id="q" type="range" min="1" max="100" value="64" oninput="document.getElementById('qv').textContent=this.value"></label><label>Model complexity<input id="c" type="range" min="1" max="100" value="42" oninput="document.getElementById('cv').textContent=this.value"></label><div class="chart"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div><div class="metric"><div><b id="qv">64</b><small>data quality</small></div><div><b id="cv">42</b><small>complexity</small></div></div></aside></main></body></html>
